name = "luvio-platform"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "frontend/.vercel/output/static"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "luvio-db"
database_id = "e62470c9-5e78-490f-a2e2-05648ff2db5c"

# R2 Storage binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "luvio-uploads"

# Durable Objects for WebSocket chat
[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

# Environment variables (non-secret)
[vars]
APP_NAME = "Luvio"
NODE_ENV = "production"

# Note: Secrets should be set via:
# wrangler secret put JWT_SECRET
# wrangler secret put STRIPE_SECRET_KEY
# etc.
