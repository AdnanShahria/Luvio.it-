# Luvio Platform — CI/CD Pipeline
#
# Triggers on every push to `main`.
# Two jobs run IN PARALLEL:
#   1. deploy-worker  → wrangler deploy → Cloudflare Worker (backend)
#   2. deploy-pages   → Cloudflare Pages direct-upload (frontend)
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — API token with Workers:Edit + Pages:Edit permissions
#   CLOUDFLARE_ACCOUNT_ID  — Your Cloudflare account ID

name: Deploy Luvio Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight deployments when a newer push arrives
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# ============================================================
# JOB 1 — Type-check & lint (gate for both deploy jobs)
# ============================================================
jobs:
  validate:
    name: ✅ Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check backend
        run: npx tsc --noEmit --project backend/tsconfig.json

      - name: Type-check frontend
        run: npx tsc --noEmit --project frontend/tsconfig.json

  # ============================================================
  # JOB 2 — Deploy backend Worker (parallel with pages job)
  # ============================================================
  deploy-worker:
    name: 🚀 Deploy Worker (Backend)
    runs-on: ubuntu-latest
    needs: validate
    # Only deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker to Cloudflare
        run: npx wrangler deploy backend/index.ts --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run D1 Migrations
        run: |
          npx wrangler d1 migrations apply luvio-db \
            --config wrangler.toml \
            --remote \
            -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ============================================================
  # JOB 3 — Build & deploy frontend to Cloudflare Pages (parallel)
  # ============================================================
  deploy-pages:
    name: 🌐 Deploy Pages (Frontend)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Next.js for Cloudflare Pages)
        run: npm run build --workspace=frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/.vercel/output/static --project-name=luvio-it --commit-dirty=true

  # ============================================================
  # JOB 4 — Post-deploy summary (runs after both deploys)
  # ============================================================
  notify:
    name: 📢 Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-worker, deploy-pages]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Report status
        run: |
          WORKER="${{ needs.deploy-worker.result }}"
          PAGES="${{ needs.deploy-pages.result }}"
          echo "## Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Worker (Backend) | $WORKER |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Pages (Frontend) | $PAGES |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

          if [ "$WORKER" != "success" ] || [ "$PAGES" != "success" ]; then
            echo "::error::One or more deployments failed. Worker: $WORKER | Pages: $PAGES"
            exit 1
          fi